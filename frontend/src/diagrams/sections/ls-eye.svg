<g id="part-lens" class="part" data-label="Lens" data-info="A transparent, flexible, biconvex structure that fine-focuses light onto the retina."><path d="M340 258 C300 262 300 378 340 382 C372 378 372 262 340 258 Z" fill="#bae6fd" fill-opacity="0.55" stroke="#ece6f2" stroke-width="1.4" /></g>
<g id="part-iris" class="part" data-label="Iris" data-info="The coloured ring of muscle that controls the size of the pupil and so how much light enters."><path d="M298 222 L306 224 L310 300 L303 300 Z" fill="#a78bfa" fill-opacity="0.75" stroke="#ece6f2" stroke-width="1.1" /><path d="M298 418 L306 416 L310 340 L303 340 Z" fill="#a78bfa" fill-opacity="0.75" stroke="#ece6f2" stroke-width="1.1" /></g>
<g id="part-pupil" class="part" data-label="Pupil" data-info="The hole in the centre of the iris through which light enters the eye."><rect x="300" y="302" width="12" height="36" fill="#ffffff" fill-opacity="0.04" stroke="#cbbfd8" stroke-width="1" stroke-dasharray="3 2"/></g>
<g id="part-fovea" class="part" data-label="Fovea" data-info="A small pit in the retina packed with cones, giving the sharpest colour vision."><path d="M615.0 310.0 Q623.0 320.0 615.0 330.0" fill="none" stroke="#ece6f2" stroke-width="1.5" /><circle cx="618" cy="320" r="4" fill="#fb923c" fill-opacity="0.9" /></g>
<g id="part-optic-nerve" class="part" data-label="Optic nerve" data-info="Carries nerve impulses from the retina to the brain."><path d="M638.7 349.1 C690 357.1 700 363.1 710 367.1 L710 408.7 C700 404.7 680 396.7 626.2 392.7 Z" fill="#fbbf24" fill-opacity="0.55" stroke="#ece6f2" stroke-width="1.3" /><path d="M613.6 365.5 C660 373.5 690 379.5 710 384.5" fill="none" stroke="#f87171" stroke-width="1.6" /><path d="M613.6 368.5 C660 377.5 690 383.5 710 388.5" fill="none" stroke="#60a5fa" stroke-width="1.6" /></g>
<g id="part-optic-disc" class="part" data-label="Optic disc (blind spot)" data-info="Where the optic nerve leaves the eye; it has no rods or cones so cannot detect light."><path d="M610.6 347.4 Q620.3 367.4 601.5 379.2 L626.2 392.7 L638.7 349.1 Z" fill="#fef3c7" fill-opacity="0.8" stroke="#ece6f2" stroke-width="1.2" /></g>
