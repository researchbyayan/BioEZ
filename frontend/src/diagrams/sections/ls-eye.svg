<g id="part-cornea" class="part" data-label="Cornea" data-info="The transparent, curved front window of the eye that refracts (bends) light entering it."><path d="M299.4 211 A130 130 0 0 0 299.4 429 L305.4 424 A122 122 0 0 1 305.4 216 Z" fill="#a5f3fc" fill-opacity="0.45" stroke="#ece6f2" stroke-width="1.2" /></g>
<g id="part-ciliary-body" class="part" data-label="Ciliary body" data-info="A ring of muscle that contracts or relaxes to change the shape of the lens when focusing."><path d="M298 214 C300.7 208.7 317 201 326 200 C335 199 349 204.3 352 208 C355 211.7 348.3 217 344 222 C339.7 227 331.7 236.3 326 238 C320.3 239.7 314.7 236 310 232 C305.3 228 295.3 219.3 298 214 Z" fill="#fb7185" fill-opacity="0.65" stroke="#ece6f2" stroke-width="1.2" /><path d="M298 426 C300.7 431.3 317 439 326 440 C335 441 349 435.7 352 432 C355 428.3 348.3 423 344 418 C339.7 413 331.7 403.7 326 402 C320.3 400.3 314.7 404 310 408 C305.3 412 295.3 420.7 298 426 Z" fill="#fb7185" fill-opacity="0.65" stroke="#ece6f2" stroke-width="1.2" /></g>
